# Server Configuration
server.port=8081

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bloodconnect}
spring.data.mongodb.database=bloodconnect

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
# Server Configuration
server.port=8081

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=bloodconnect

# MongoDB SSL Configuration - FIX SSL ERRORS
spring.data.mongodb.ssl.enabled=true
spring.data.mongodb.ssl.invalid-host-name-allowed=true

# Add this to fix Java 17 SSL issues
spring.data.mongodb.connection-pool.max-size=10
spring.data.mongodb.connection-pool.min-size=2
spring.data.mongodb.connection-pool.max-wait-time=120000

